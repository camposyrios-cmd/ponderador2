<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Balanza de la Verdad - Inicio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#111827',
                            light: '#f9f8f6',
                            muted: '#6b7280'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #f9f8f6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden; 
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-2 md:p-6 bg-[#f9f8f6]">
    
    <div class="w-full max-w-6xl h-full bg-white rounded-3xl shadow-2xl border border-gray-100 flex flex-col p-4 md:p-8">
        
        <!-- Encabezado -->
        <div class="flex-shrink-0 text-center mb-4 md:mb-8 mt-2">
            <h1 class="font-serif text-2xl md:text-5xl font-black text-brand-dark mb-2 tracking-tight leading-tight">
                ¿Qué tanta corrupción denuncia el libro de la verdad?
            </h1>
            <p class="font-sans text-brand-muted text-sm md:text-base max-w-2xl mx-auto uppercase tracking-wider font-semibold">
                Elige un caso:
            </p>
        </div>

        <!-- Matriz de Botones -->
        <div class="flex-1 min-h-0 w-full flex items-center justify-center">
            
            <div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2 md:gap-4 w-full h-full max-h-[70vh] content-center">
                
                <!-- Caso 1 (Activo) -->
                <a href="caso-1.html" class="group relative flex items-center justify-center bg-[#f9f8f6] hover:bg-brand-dark border border-gray-200 hover:border-brand-dark rounded-xl transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-1 aspect-square">
                    <span class="font-sans text-xl md:text-3xl font-black text-brand-dark group-hover:text-white transition-colors">1</span>
                </a>

                <!-- Función generadora de botones inactivos -->
                <script>
                    const renderInactiveButton = (num) => `
                        <div class="group relative flex items-center justify-center bg-gray-50 border border-gray-100 rounded-xl cursor-not-allowed opacity-50 hover:opacity-100 transition-opacity duration-300 aspect-square">
                            <span class="font-sans text-xl md:text-3xl font-bold text-gray-400">${num}</span>
                            <!-- Etiqueta emergente (Tooltip) -->
                            <div class="absolute -top-8 md:-top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-[10px] md:text-xs font-sans px-2 py-1 md:px-3 md:py-1.5 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-10 whitespace-nowrap shadow-md">
                                Próximamente
                            </div>
                        </div>
                    `;

                    document.write(renderInactiveButton(2));
                    document.write(renderInactiveButton(3));
                    document.write(renderInactiveButton(4));
                </script>

                <!-- Caso 5 (Activo) -->
                <a href="caso-5.html" class="group relative flex items-center justify-center bg-[#f9f8f6] hover:bg-brand-dark border border-gray-200 hover:border-brand-dark rounded-xl transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-1 aspect-square">
                    <span class="font-sans text-xl md:text-3xl font-black text-brand-dark group-hover:text-white transition-colors">5</span>
                </a>

                <!-- Casos 6 al 23 (Inactivos inyectados con el script para mantener el código limpio) -->
                <script>
                    for(let i = 6; i <= 23; i++) {
                        document.write(renderInactiveButton(i));
                    }
                </script>

            </div>
        </div>
    </div>
</body>
</html>
